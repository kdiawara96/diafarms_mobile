plugins {
    alias(libs.plugins.android.application)
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}

android {
    namespace 'com.mobile.diafarms'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.mobile.diafarms"
        minSdk 24
        targetSdk 36
        versionCode 29
        versionName "1.28"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // Identifiants lus depuis local.properties (jamais commité, voir
            // .gitignore) — le fichier .jks lui-même est dans keystore/, aussi
            // gitignoré. Sans ces deux fichiers présents localement, assembleRelease
            // échoue proprement plutôt que de produire un APK non signé.
            if (localProps.getProperty('RELEASE_STORE_FILE')) {
                storeFile rootProject.file(localProps.getProperty('RELEASE_STORE_FILE'))
                storePassword localProps.getProperty('RELEASE_STORE_PASSWORD')
                keyAlias localProps.getProperty('RELEASE_KEY_ALIAS')
                keyPassword localProps.getProperty('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    // CardView pour les cartes
    implementation libs.cardview

    // ML Kit Barcode Scanning
    implementation libs.barcode.scanning

    // CameraX
    def camerax_version = "1.3.1"
    implementation libs.camera.core
    implementation libs.camera.camera2
    implementation libs.camera.lifecycle
    implementation libs.camera.view
    implementation libs.gson

    // Réseau (appels vers diafarms_back)
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson
    implementation libs.okhttp

    // Stockage chiffré du token de session (EncryptedSharedPreferences)
    implementation libs.security.crypto

    // Vérification périodique des alertes en arrière-plan (notifications locales,
    // voir AlertCheckWorker) — pas de vrai push (pas de Firebase), juste un contrôle
    // toutes les 15-30 min tant que le téléphone a du réseau.
    implementation libs.work.runtime
}